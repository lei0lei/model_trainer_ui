[project]
name = "model-trainer-backend"
version = "0.1.0"
description = "FastAPI control plane for model training UI"
readme = "README.md"
authors = [
    { name = "meng fanlei", email = "lei.lei.fan.meng@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
model-trainer-api = "model_trainer_backend.main:run"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
